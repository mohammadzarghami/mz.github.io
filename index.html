<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammad Zarghami | محمد ضرغامی</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');

        :root {
            --bg-color: #010409;
            --primary-glow: #00e5ff;
            --secondary-glow: #f72585;
            --text-color: #c9d1d9;
            --keyword-color: #f72585;
            --string-color: #72f1b8;
            --function-color: #a29bfe;
            --border-color: rgba(0, 229, 255, 0.2);
            --glitch-text-shadow1: 0 0 5px var(--primary-glow), 0 0 10px var(--primary-glow), 0 0 15px var(--primary-glow);
            --glitch-text-shadow2: 0 0 5px var(--secondary-glow), 0 0 10px var(--secondary-glow), 0 0 15px var(--secondary-glow);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Vazirmatn', 'Fira Code', monospace;
            overflow: hidden; /* جلوگیری از اسکرول */
            cursor: none; /* مخفی کردن کرسر پیش‌فرض */
        }

        /* --- پس‌زمینه ماتریسی --- */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* --- افکت دنبال‌کننده ماوس --- */
        .cursor-glow {
            position: fixed;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary-glow);
            filter: blur(25px);
            z-index: 9999;
            pointer-events: none; /* اجازه کلیک از روی آن */
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s;
        }

        /* --- کانتینر اصلی --- */
        .hero {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- پنجره ترمینال --- */
        .terminal {
            background-color: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 90%;
            max-width: 700px;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.25);
            font-family: 'Fira Code', monospace;
            font-size: 1.1rem;
            position: absolute; /* برای قابلیت جابجایی */
            transition: transform 0.4s ease, opacity 0.4s ease;
            z-index: 10;
        }

        .terminal.hidden {
            transform: scale(0.8);
            opacity: 0;
            pointer-events: none;
        }

        .terminal-header {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            cursor: move; /* نشانگر جابجایی */
        }

        .terminal-buttons {
            display: flex;
        }
        
        .terminal-buttons span {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-left: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .terminal-buttons span:hover {
            transform: scale(1.2);
        }

        #close-btn { background-color: #ff5f56; }
        #reset-btn { background-color: #ffbd2e; }
        #run-btn { background-color: #27c93f; }

        .terminal-title {
            color: var(--text-color);
            margin: 0 auto;
            font-size: 0.9rem;
            pointer-events: none; /* جلوگیری از تداخل با درگ */
        }
        
        .terminal-body {
            padding: 1.5rem;
            text-align: left;
            direction: ltr;
            min-height: 180px;
        }

        #code-output {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px dashed var(--border-color);
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary-glow);
            min-height: 50px;
            text-align: center;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.3rem;
            background-color: var(--primary-glow);
            margin-left: 2px;
            animation: blink 1s infinite;
        }

        /* --- انیمیشن‌ها --- */
        @keyframes blink {
            50% { opacity: 0; }
        }
        
        .terminal.shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .glitch {
            animation: glitch 1.5s linear infinite;
        }
        
        @keyframes glitch {
            2%,64% { transform: translate(2px,0) skew(0.5deg); }
            4%,60% { transform: translate(-2px,0) skew(-0.5deg); }
            62% { transform: translate(0,0) skew(5deg); }
        }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            overflow: hidden;
            top: 0;
        }
        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 var(--secondary-glow);
            animation: glitch-anim-1 2.5s infinite linear reverse;
        }
        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 var(--primary-glow);
            animation: glitch-anim-2 2s infinite linear reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(10% 0 80% 0); } 20% { clip-path: inset(50% 0 10% 0); } 40% { clip-path: inset(25% 0 60% 0); } 60% { clip-path: inset(70% 0 5% 0); } 80% { clip-path: inset(90% 0 2% 0); } 100% { clip-path: inset(40% 0 45% 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip-path: inset(75% 0 2% 0); } 20% { clip-path: inset(15% 0 80% 0); } 40% { clip-path: inset(40% 0 33% 0); } 60% { clip-path: inset(80% 0 10% 0); } 80% { clip-path: inset(20% 0 70% 0); } 100% { clip-path: inset(60% 0 5% 0); }
        }

        .keyword { color: var(--keyword-color); }
        .function { color: var(--function-color); }
        .string { color: var(--string-color); }
        .variable { color: var(--text-color); }
    </style>
</head>
<body>
    
    <canvas id="matrix-canvas"></canvas>
    <div class="cursor-glow"></div>

    <div class="hero">
        <div id="terminal" class="terminal">
            <div id="terminal-header" class="terminal-header">
                <div class="terminal-buttons">
                    <span id="close-btn"></span>
                    <span id="reset-btn"></span>
                    <span id="run-btn"></span>
                </div>
                <div class="terminal-title">system:/usr/bin/mz_intro</div>
            </div>
            <div class="terminal-body">
                <div id="code-content"></div>
                <div id="code-output"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const terminal = document.getElementById('terminal');
            const terminalHeader = document.getElementById('terminal-header');
            const codeContent = document.getElementById('code-content');
            const codeOutput = document.getElementById('code-output');
            const runBtn = document.getElementById('run-btn');
            const resetBtn = document.getElementById('reset-btn');
            const closeBtn = document.getElementById('close-btn');
            const cursorGlow = document.querySelector('.cursor-glow');

            let isTyping = false;
            
            // --- 1. انیمیشن پس‌زمینه ماتریسی ---
            const canvas = document.getElementById('matrix-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890@#$%^&*()[]{}<>/|";
            const charsArray = chars.split('');
            const fontSize = 14;
            const columns = canvas.width / fontSize;
            const drops = Array(Math.floor(columns)).fill(1);

            function drawMatrix() {
                ctx.fillStyle = 'rgba(1, 4, 9, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'var(--primary-glow)';
                ctx.font = fontSize + 'px Fira Code';
                for (let i = 0; i < drops.length; i++) {
                    const text = charsArray[Math.floor(Math.random() * charsArray.length)];
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }
            setInterval(drawMatrix, 35);


            // --- 2. افکت دنبال‌کننده ماوس ---
            document.addEventListener('mousemove', (e) => {
                cursorGlow.style.left = e.clientX + 'px';
                cursorGlow.style.top = e.clientY + 'px';
            });
            document.addEventListener('mousedown', () => cursorGlow.style.transform = 'translate(-50%, -50%) scale(0.8)');
            document.addEventListener('mouseup', () => cursorGlow.style.transform = 'translate(-50%, -50%) scale(1)');

            // --- 3. قابلیت جابجایی پنجره ترمینال ---
            let isDragging = false;
            let offsetX, offsetY;

            terminalHeader.addEventListener('mousedown', (e) => {
                isDragging = true;
                offsetX = e.clientX - terminal.offsetLeft;
                offsetY = e.clientY - terminal.offsetTop;
                terminal.style.transition = 'none'; // برای حرکت نرم
            });

            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    terminal.style.left = (e.clientX - offsetX) + 'px';
                    terminal.style.top = (e.clientY - offsetY) + 'px';
                }
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
                terminal.style.transition = 'transform 0.4s ease, opacity 0.4s ease';
            });


            // --- 4. منطق دکمه‌ها و انیمیشن تایپ ---
            const codeLines = [
                { text: 'print', type: 'function' },
                { text: '(', type: 'variable' },
                { text: '"Mohammad Zarghami"', type: 'string' },
                { text: ')', type: 'variable' }
            ];
            const outputText = 'Mohammad Zarghami';

            function sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            async function typeWriter() {
                isTyping = true;
                runBtn.style.pointerEvents = 'none'; // غیرفعال کردن دکمه هنگام اجرا

                // لرزش
                terminal.classList.add('shake');
                await sleep(500);
                terminal.classList.remove('shake');
                
                // تایپ کد
                for (const line of codeLines) {
                    const span = document.createElement('span');
                    span.className = line.type;
                    codeContent.appendChild(span);
                    for (const char of line.text) {
                        span.innerHTML += char;
                        await sleep(60);
                    }
                }
                codeContent.innerHTML += '<span class="cursor"></span>';
                
                await sleep(1000); // مکث قبل از پاک کردن
                
                // پاک کردن کد
                const currentCode = codeContent.innerHTML;
                for (let i = currentCode.length - '<span class="cursor"></span>'.length; i >= 0; i--) {
                    codeContent.innerHTML = currentCode.substring(0, i) + '<span class="cursor"></span>';
                    await sleep(20);
                }
                
                await sleep(500); // مکث قبل از نمایش خروجی

                // نمایش خروجی با افکت گلیچ
                codeOutput.setAttribute('data-text', outputText);
                codeOutput.classList.add('glitch');
                for (const char of outputText) {
                    codeOutput.innerHTML += char;
                    await sleep(100);
                }
                isTyping = false;
            }

            function resetTerminal() {
                if (isTyping) return;
                codeContent.innerHTML = '';
                codeOutput.innerHTML = '';
                codeOutput.classList.remove('glitch');
                runBtn.style.pointerEvents = 'auto';
                if(terminal.classList.contains('hidden')) {
                    terminal.classList.remove('hidden');
                }
            }

            runBtn.addEventListener('click', () => {
                if (!isTyping) {
                    resetTerminal();
                    typeWriter();
                }
            });

            resetBtn.addEventListener('click', resetTerminal);
            closeBtn.addEventListener('click', () => terminal.classList.add('hidden'));

        });
    </script>
</body>
</html>
